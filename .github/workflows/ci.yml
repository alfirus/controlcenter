name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go vet ./backend/...
      - run: go test ./backend/... -count=1
      - run: go build -o /tmp/server ./backend/cmd/server
